[project]
name = "max-system"
version = "0.1.0"
description = "Max 多Agent室内设计AI助手系统 - 斑马精装"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "lark-oapi>=1.5.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.5",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[project.scripts]
max-system = "max_system.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["max_system/tests"]
